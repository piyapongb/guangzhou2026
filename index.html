<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Guangzhou Trip 2026 — Travel Itinerary</title>
  <meta name="description" content="A compact, mobile-first travel itinerary: day-by-day schedule, restaurants, and hotels for Guangzhou Trip 2026." />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="utility-bar">
    <div class="utility-bar-inner">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18">
          <path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/>
        </svg>
        <span>Guangzhou Trip 2026</span>
      </div>
      <div id="theme-control" class="theme-control" role="group" aria-label="Theme">
        <button type="button" class="theme-btn" data-theme-option="light" aria-pressed="false" aria-label="Light theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="theme-btn" data-theme-option="dark" aria-pressed="false" aria-label="Dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        </button>
        <button type="button" class="theme-btn" data-theme-option="system" aria-pressed="false" aria-label="Use system theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="hero-root"></div>

  <div class="main-tabs-bar">
    <div id="main-tabs-root" class="container"></div>
  </div>

  <main id="main-content" class="container">
    <section id="panel-itinerary" class="tab-panel" role="tabpanel" aria-labelledby="tab-itinerary"></section>
    <section id="panel-restaurants" class="tab-panel" role="tabpanel" aria-labelledby="tab-restaurants" hidden></section>
    <section id="panel-hotels" class="tab-panel" role="tabpanel" aria-labelledby="tab-hotels" hidden></section>
  </main>

  <footer class="site-footer">
    <p>Guangzhou Trip 2026</p>
  </footer>

  <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
    <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close photo viewer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="20" height="20"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
    <img id="lightbox-image" src="" alt="" />
  </dialog>

  <noscript>
    <p style="padding:24px;text-align:center;font-family:sans-serif;">
      This itinerary needs JavaScript enabled to display trip content.
    </p>
  </noscript>

  <script src="js/utils.js"></script>
  <script src="data/trip.js"></script>
  <script src="data/locations.js"></script>
  <script src="data/itinerary.js"></script>
  <script src="data/restaurants.js"></script>
  <script src="data/hotels.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

</html>
