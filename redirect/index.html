<!DOCTYPE html>
<!--
  ===========================================================================
  หน้าแจ้งย้ายเว็บ + นับถอยหลังไปเว็บใหม่อัตโนมัติ

  ไฟล์เดียวจบ ไม่ต้องมีไฟล์อื่นประกอบ ไม่ต้องต่อเน็ต ไม่มี library
  เอาไปวางไว้ที่ไหนก็ได้ เช่น  http://192.168.1.8/index.html
  หรือวางบนเว็บเก่าเองเป็น /moved.html (แนะนำ — ดู README)
  แล้วเอา URL นั้นไปใส่ใน popup module ของเว็บเก่า

  รองรับ popup ทั้งสองแบบ: แบบ iframe ในหน้า และแบบเปิดหน้าต่างใหม่
  ด้วย window.open

  จุดที่แก้เองบ่อย มี 2 ที่ ทั้งคู่มีกรอบ ==== ล้อมไว้ให้หาง่าย
    1. หน้าตา/ขนาด  → "ปรับหน้าตาได้ตรงนี้" ในส่วน <style> ข้างล่างนี้
    2. ปลายทาง/เวลา → "ตั้งค่าได้ตรงนี้" ในส่วน <script> ท้ายไฟล์
  ===========================================================================
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>เว็บไซต์ย้ายไปที่อยู่ใหม่</title>
<style>
  /* ==================== ปรับหน้าตาได้ตรงนี้ ==============================
     แก้แค่ตัวเลขในบล็อกนี้พอ ไม่ต้องไปยุ่งกับ CSS ข้างล่าง
     ทุกค่ามีหน่วยกำกับ (px) อย่าลืมใส่ px ด้วยตอนแก้
     ====================================================================== */
  :root {
    /* ความกว้างของกล่องเนื้อหา — ค่าเดิมคือ 460px */
    --card-width: 760px;

    /* ระยะขอบรอบกล่อง เขียนเป็น "บน-ล่าง  ซ้าย-ขวา" */
    --page-padding: 28px 24px;

    /* ขนาดตัวอักษรส่วนต่าง ๆ */
    --title-size: 22px;   /* หัวข้อใหญ่ */
    --text-size:  16px;   /* คำอธิบาย */
    --url-size:   16px;   /* กล่อง URL เว็บใหม่ */
    --btn-size:   17px;   /* ตัวหนังสือบนปุ่ม */

    /* ขนาดปุ่ม เขียนเป็น "บน-ล่าง  ซ้าย-ขวา" */
    --btn-padding: 13px 26px;

    /* วงกลมไอคอนลูกศรด้านบน — ใส่ 0px ถ้าไม่อยากให้มีไอคอน */
    --icon-size: 56px;

    /* ความมนของมุมกล่อง/ปุ่ม */
    --radius: 8px;
  }

  /* สีทั้งหมด (โหมดสว่าง) — โหมดมืดอยู่ท้ายส่วน <style> */
  :root {
    --bg: #ffffff;
    --fg: #12263f;
    --muted: #5a6b82;
    --brand: #0b63c5;
    --brand-dark: #084a95;
    --border: #dde5ef;
    --warn: #8a5a00;
    --warn-bg: #fff6e5;
  }
  /* ================== จบส่วนที่ปรับเองได้ =============================== */

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Noto Sans Thai", "Sarabun", "Segoe UI", Tahoma, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--page-padding);
    text-align: center;   /* เปลี่ยนเป็น left ได้ถ้าอยากให้ชิดซ้าย */
  }
  /* กล่องเนื้อหา — กว้างเท่า --card-width แต่ไม่เกินความกว้างของ popup
     ที่เว็บเก่าตั้งไว้ ถ้าขยายแล้วยังดูแคบ ให้ไปเพิ่ม width ของ iframe
     ในเว็บเก่าด้วย ไม่งั้นกล่องจะชนขอบ popup ก่อนถึงค่านี้ */
  .card { max-width: var(--card-width); width: 100%; }
  .icon {
    width: var(--icon-size);
    height: var(--icon-size);
    margin: 0 auto 16px;
    border-radius: 50%;
    background: #e8f1fc;
    color: var(--brand);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .icon svg { width: 50%; height: 50%; }
  .card h1, .card h2, .card h3 {
    font-size: var(--title-size);
    line-height: 1.4;
    font-weight: 700;
    margin: 0 0 10px;
  }
  p {
    margin: 0 0 8px;
    font-size: var(--text-size);
    line-height: 1.6;
    color: var(--muted);
  }
  .newurl {
    display: block;
    margin: 14px 0 18px;
    padding: 12px 14px;
    background: #f5f8fc;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: var(--url-size);
    color: var(--brand-dark);
    word-break: break-all;
    text-decoration: none;
    font-weight: 600;
  }
  .newurl:hover { background: #eaf2fb; }
  .btn {
    display: inline-block;
    padding: var(--btn-padding);
    border: 0;
    border-radius: var(--radius);
    background: var(--brand);
    color: #fff;
    font-size: var(--btn-size);
    font-weight: 700;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.is-urgent { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(11, 99, 197, 0.45); }
    50%      { box-shadow: 0 0 0 10px rgba(11, 99, 197, 0); }
  }
  .countdown {
    margin-top: 14px;
    font-size: 14px;
    color: var(--muted);
    min-height: 20px;
  }
  .countdown b { color: var(--brand-dark); font-size: 16px; }
  .countdown.is-warn {
    color: var(--warn);
    background: var(--warn-bg);
    border-radius: var(--radius);
    padding: 8px 10px;
  }
  .cancel {
    display: block;
    margin: 6px auto 0;
    /* ต้องประกาศเอง เพราะ display:block ข้างบนทับค่า hidden ของเบราว์เซอร์ */
    background: none;
    border: 0;
    padding: 4px;
    color: var(--muted);
    font-size: 13px;
    font-family: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  .cancel[hidden] { display: none; }
  .bar {
    height: 4px;
    width: 100%;
    margin-top: 16px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--brand);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 1s linear;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131a24; --fg: #eaf1f8; --muted: #a5b4c6;
      --brand: #4d9df0; --brand-dark: #7bb8f5; --border: #2a3542;
      --warn: #ffcc73; --warn-bg: #3a2f18;
    }
    .icon { background: #1c2836; }
    .newurl { background: #1a2430; }
    .btn { color: #08111c; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h14"></path><path d="M13 6l6 6-6 6"></path>
      </svg>
    </div>

    <h3>เพื่อให้เป็นไปตามมาตรการความมั่นคงปลอดภัยด้านไซเบอร์ของ กฟผ.</h3>
    <p>เว็บไซต์นี้ได้ย้ายไปยังที่อยู่ใหม่ กรุณาใช้ลิงก์ด้านล่างแทน</p>

    <a class="newurl" id="newUrlLink" href="#" target="_top" rel="noopener">&hellip;</a>

    <a class="btn" id="goNow" href="#" target="_top" rel="noopener">ไปเว็บไซต์ใหม่ตอนนี้</a>

    <div class="countdown" id="countdown"></div>
    <button class="cancel" id="cancel" type="button" hidden>ยกเลิกการเปลี่ยนหน้าอัตโนมัติ</button>

    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ======================= ตั้งค่าได้ตรงนี้ =============================== */

  // เว็บใหม่ที่จะพาไป
  var TARGET_URL = "http://agg2.egat.co.th/";

  // นับถอยหลังกี่วินาทีก่อนไปเอง (ใส่ 0 = ไปทันที)
  var SECONDS = 10;

  // ถ้าเบราว์เซอร์บล็อกการเปลี่ยนหน้าอัตโนมัติ (เกิดตอนไฟล์นี้อยู่คนละเครื่อง
  // กับเว็บเก่า เช่นวางไว้ที่ 192.168.1.8 แต่เว็บเก่าอยู่อีกที่) จะให้ทำอะไรต่อ
  //   "button"  = ขึ้นข้อความบอกให้กดปุ่มเอง  (แนะนำ — ผู้ใช้ไม่งง)
  //   "inframe" = โหลดเว็บใหม่ในกรอบ popup นี้เลย (auto แต่เว็บใหม่จะอยู่ในกรอบเล็ก)
  var ON_BLOCKED = "button";

  /* ====================================================================== */

  // เว็บเก่าจะส่งค่ามาทาง query string แทนการแก้ไฟล์นี้ก็ได้ เช่น
  //   http://192.168.1.8/index.html?url=https://example.com&sec=8
  try {
    var qs = new URLSearchParams(window.location.search);
    var qUrl = qs.get("url");
    var qSec = parseInt(qs.get("sec"), 10);
    if (qUrl && /^https?:\/\//i.test(qUrl)) { TARGET_URL = qUrl; }
    if (!isNaN(qSec) && qSec >= 0 && qSec <= 60) { SECONDS = qSec; }
  } catch (e) { /* เบราว์เซอร์เก่ามาก — ใช้ค่าที่ตั้งไว้ข้างบน */ }

  var link      = document.getElementById("newUrlLink");
  var goNow     = document.getElementById("goNow");
  var countdown = document.getElementById("countdown");
  var cancelBtn = document.getElementById("cancel");
  var bar       = document.getElementById("bar");

  link.href = TARGET_URL;
  link.textContent = TARGET_URL;
  goNow.href = TARGET_URL;

  // หน้านี้ถูกเปิดมาแบบไหน — อยู่ในกรอบ iframe / เป็นหน้าต่าง popup ที่ถูก
  // window.open ขึ้นมา / หรือเปิดตรง ๆ
  var inFrame;
  try { inFrame = (window.top !== window.self); } catch (e) { inFrame = true; }

  var opener = null;
  try {
    if (window.opener && !window.opener.closed) { opener = window.opener; }
  } catch (e) { opener = null; }

  var blockedTimer = null;

  // พาทั้งหน้า (ไม่ใช่แค่ในกรอบ) ไปเว็บใหม่ — ไล่ลองทีละวิธี
  //   1. postMessage บอกเว็บเก่าให้พาไปเอง — ใช้ได้แม้อยู่คนละเครื่อง
  //      แต่เว็บเก่าต้องมีตัวรับ (ดู embed-snippet.html) ถ้าไม่มีก็ไม่พัง เงียบไป
  //   2. สั่ง window.top ตรง ๆ — ได้ผลเมื่อไฟล์นี้อยู่โดเมนเดียวกับเว็บเก่า
  //      ถ้าคนละโดเมน เบราว์เซอร์จะบล็อกแบบ "เงียบ ๆ" ไม่ throw ให้จับ
  //      จึงต้องใช้วิธีตั้งเวลาเช็กว่าหน้านี้ยังอยู่ไหม (ข้อ 3)
  //   3. ยังอยู่ = โดนบล็อก → ทำตามค่า ON_BLOCKED
  function redirect() {
    if (!inFrame) {
      // popup module บางตัวไม่ได้ใช้ iframe แต่เปิดเป็น "หน้าต่างใหม่"
      // ด้วย window.open — กรณีนี้พาหน้าต่างแม่ (เว็บเก่า) ไปเว็บใหม่
      // แล้วปิดหน้าต่าง popup นี้ทิ้ง
      if (opener) {
        try {
          opener.location.href = TARGET_URL;
          opener.focus();
        } catch (e) { /* ทำไม่ได้ ก็ปล่อยให้ตกไปพาหน้าต่างนี้ไปแทน */ }
        try { window.close(); } catch (e) { /* บางเบราว์เซอร์ไม่ยอมให้ปิด */ }
        // ปิดไม่สำเร็จ (ยังอยู่) → อย่างน้อยพาหน้าต่างนี้ไปเว็บใหม่
        setTimeout(function () { window.location.href = TARGET_URL; }, 1200);
        return;
      }

      // เปิดหน้านี้ตรง ๆ ไม่มีข้อจำกัดอะไร
      window.location.href = TARGET_URL;
      return;
    }

    try {
      window.parent.postMessage(
        { type: "site-moved-redirect", url: TARGET_URL }, "*"
      );
    } catch (e) { /* ไม่เป็นไร ลองวิธีถัดไป */ }

    try {
      window.top.location.href = TARGET_URL;
    } catch (e) { /* คนละโดเมน — ถือว่าโดนบล็อก */ }

    blockedTimer = setTimeout(onBlocked, 1500);
    // ถ้าเปลี่ยนหน้าสำเร็จ หน้านี้จะถูกทิ้งก่อน 1.5 วิ — ยกเลิกตัวจับเวลาซะ
    window.addEventListener("pagehide", clearBlockedTimer);
    window.addEventListener("beforeunload", clearBlockedTimer);
  }

  function clearBlockedTimer() {
    if (blockedTimer) { clearTimeout(blockedTimer); blockedTimer = null; }
  }

  function onBlocked() {
    blockedTimer = null;

    if (ON_BLOCKED === "inframe") {
      window.location.href = TARGET_URL;   // โหลดเว็บใหม่ในกรอบนี้
      return;
    }

    countdown.className = "countdown is-warn";
    countdown.textContent =
      "เบราว์เซอร์ไม่อนุญาตให้เปลี่ยนหน้าอัตโนมัติจากในกรอบนี้ " +
      "กรุณากดปุ่ม “ไปเว็บไซต์ใหม่ตอนนี้” ด้านบน";
    goNow.className = "btn is-urgent";
    try { goNow.focus(); } catch (e) { /* ไม่สำคัญ */ }
  }

  var remaining = SECONDS;
  var timer = null;

  // หยุดนับ และแช่แถบความคืบหน้าไว้ตรงที่มันอยู่ (ไม่ให้วิ่งต่อ)
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    bar.style.transition = "none";
  }

  function render() {
    countdown.innerHTML =
      "จะพาไปเว็บไซต์ใหม่อัตโนมัติใน <b>" + remaining + "</b> วินาที";
    bar.style.transform = "scaleX(" + ((SECONDS - remaining) / SECONDS) + ")";
  }

  // กดเองได้ทันที ไม่ต้องรอครบเวลา — ปล่อยให้ลิงก์ทำงานเองตามปกติ
  // (target="_top" + คนกดเอง = เบราว์เซอร์ยอมให้พาไปทั้งหน้าแม้คนละโดเมน
  //  ซึ่งชัวร์กว่าสั่งด้วย JS มาก จึงไม่ดัก preventDefault ตรงนี้)
  goNow.addEventListener("click", function () { stop(); clearBlockedTimer(); });
  link.addEventListener("click",  function () { stop(); clearBlockedTimer(); });

  // ยกเว้นตอนเป็นหน้าต่าง popup แยก — target="_top" จะพาแค่หน้าต่างเล็กนี้ไป
  // ทิ้งเว็บเก่าค้างอยู่ในหน้าต่างแม่ จึงต้องดักเองให้พาหน้าต่างแม่ไปแทน
  if (!inFrame && opener) {
    var openerClick = function (ev) { ev.preventDefault(); redirect(); };
    goNow.addEventListener("click", openerClick);
    link.addEventListener("click", openerClick);
  }

  if (SECONDS > 0) {
    cancelBtn.hidden = false;
    cancelBtn.addEventListener("click", function () {
      stop();
      clearBlockedTimer();
      bar.style.transform = "scaleX(0)";
      cancelBtn.hidden = true;
      countdown.className = "countdown";
      countdown.textContent = "ยกเลิกแล้ว — กดปุ่มด้านบนเพื่อไปเว็บไซต์ใหม่";
    });

    render();
    timer = setInterval(function () {
      remaining -= 1;
      if (remaining <= 0) {
        stop();
        cancelBtn.hidden = true;
        countdown.textContent = "กำลังพาไปเว็บไซต์ใหม่…";
        redirect();
        return;
      }
      render();
    }, 1000);
  } else {
    cancelBtn.hidden = true;
    redirect();
  }
})();
</script>
</body>
</html>
