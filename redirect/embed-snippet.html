<!--
  ===========================================================================
  โค้ดฝั่ง "เว็บเก่า" — เป็นของเสริม ไม่ใส่ก็ใช้งานได้ (แต่ใส่แล้วดีกว่ามาก)

  ในไฟล์นี้มี 2 ก้อน เลือกใช้ตามสถานการณ์:

    ก้อน A — เว็บเก่ามี iframe popup อยู่แล้ว (แค่เอา URL ไปใส่)
             ใส่ก้อน A เพื่อให้ "เด้งอัตโนมัติหลัง 5 วิ" ทำงานได้จริง
             แม้ไฟล์ index.html จะอยู่คนละเครื่อง (เช่น 192.168.1.8)
             ยาว 10 บรรทัด วางที่เดียวจบ

    ก้อน B — เว็บเก่ายังไม่มี popup ต้องการให้สร้าง popup ให้ด้วย
             ใส่ก้อน B ก้อนเดียว (มีตัวรับของก้อน A รวมอยู่ในนั้นแล้ว)

  ทั้งสองก้อนวางก่อน </body> ของเว็บเก่า ถ้าเว็บเก่ามีไฟล์ footer/template
  ที่ทุกหน้าเรียกใช้ร่วมกัน วางในไฟล์นั้นไฟล์เดียวพอ
  ===========================================================================
-->


<!-- =========================================================================
     ก้อน A — ตัวรับสัญญาณจากหน้า popup (ใช้กับ popup ที่มีอยู่แล้ว)
     ========================================================================= -->
<script>
(function () {
  "use strict";
  // ต้องตรงกับ TARGET_URL ใน index.html
  var NEW_URL = "http://agg2.egat.co.th/";

  // หน้า popup จะส่ง message มาบอกเมื่อนับถอยหลังครบ เว็บเก่าเป็นคนพาไปเอง
  // จึงไม่ติดข้อจำกัดเรื่องคนละโดเมน (ไม่เชื่อ url ที่ส่งมาใน message —
  // ใช้ NEW_URL ที่ตั้งไว้ข้างบนเสมอ)
  window.addEventListener("message", function (ev) {
    if (!ev.data || ev.data.type !== "site-moved-redirect") { return; }
    window.location.href = NEW_URL;
  });
})();
</script>
